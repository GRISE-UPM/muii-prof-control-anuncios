# cognito.properties (lo genera cognito.sh) y el secreto SECRET_NAME (secrets.sh) son opcionales para que
# la aplicación arranque en cuanto se despliega. Sin ellos, /api/whoami responde (sin huella válida del
# secreto) y los endpoints protegidos (/api/mensajes) dan 401.
# SECRET_NAME y EXAM_ID llegan como variables de entorno del servicio systemd (back.sh).
spring.config.import=optional:classpath:cognito.properties,optional:aws-secretsmanager:${SECRET_NAME:sin-secreto}
server.port=8080

# Comprobación de salud (/actuator/health) en un puerto de gestión distinto del de la API.
management.server.port=8090
management.endpoints.web.exposure.include=health

exam.id=${EXAM_ID:sin-id}

# Base de datos H2 en FICHERO. username, password y dbname salen del secreto; sin él, valores por defecto.
# El fichero lleva el nombre del usuario: la contraseña vive en la propia base de datos desde que se crea.
# Si cambia el secreto y la base de datos conserva la contraseña antigua, la aplicación no puede conectarse.
# DB_DIR es el directorio de datos. En la instancia lo fija el servicio systemd (back.sh).
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=ace4b573e953db9a53b6f7b0
spring.datasource.url=jdbc:h2:file:${DB_DIR:./data}/anuncios;USER=admin;PASSWORD=ace4b573e953db9a53b6f7b0;

# Consola web de H2. Nginx NO la publica y el puerto 8080 no está abierto: solo se llega por túnel SSH.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
